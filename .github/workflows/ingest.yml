name: Ingest food enforcement data

# Pulls real food-recall records from the openFDA food enforcement API into the
# database on a schedule. Runs in the cloud, so data updates automatically
# without anyone's laptop being on.
#
# Requires a repo secret DATABASE_URL (the Supabase Session-pooler URL):
#   gh secret set DATABASE_URL --body "postgresql://postgres.<ref>:<pwd>@aws-1-<region>.pooler.supabase.com:5432/postgres?sslmode=require"

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab
    inputs:
      limit:
        description: "records per contaminant search term"
        default: "50"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet psycopg2-binary numpy scipy networkx

      # Each step below runs through pipeline.run_and_log instead of the
      # module directly — it writes a pipeline_runs row so /admin can show
      # per-source ingest health, and distinguishes an *expected* empty
      # result (FoSCoS's documented auth gate, AGMARKNET's flaky public rate
      # limit) from a *real* regression. Only a real regression exits 1.

      - name: Sync database schema (idempotent — applies any new migrations)
        id: bootstrap_db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # scripts/bootstrap_db.py applies schema.sql + every
        # schema_migration_*.sql in order. Already-applied files report
        # "skipped" via Postgres's duplicate-object error codes rather than
        # failing, so running this daily is a no-op once a migration has
        # landed — but it means a new migration file merged to main goes
        # live on the next scheduled run instead of needing someone to
        # remember the manual `docs/DEPLOYMENT.md` step. No continue-on-error:
        # every other step in this workflow depends on the schema this
        # produces, so a real failure here should stop the job loudly, the
        # same as the openFDA step below.
        run: python -m scripts.bootstrap_db

      - name: Ingest openFDA food enforcement (real US FDA recalls)
        id: openfda
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log openfda --limit "${{ github.event.inputs.limit || '50' }}"

      - name: Ingest AGMARKNET districts/commodities (data.gov.in)
        id: agmarknet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
        continue-on-error: true   # tangential reference data; don't fail the run
        run: python -m pipeline.run_and_log agmarknet --limit 1000

      - name: Scrape FoSCoS food recalls (headless browser)
        id: fssai_recall
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # gov portal can be in its maintenance window
        # cron is 06:00 UTC = 11:30 IST, outside FoSCoS maintenance (23:30–03:00 IST)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python -m pipeline.run_and_log fssai_recall --limit 100

      - name: Refresh FSSAI state commissioner directory (headless browser)
        id: fssai_commissioners
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # contact directory, not core enforcement data — don't fail the run
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python -m pipeline.run_and_log fssai_commissioners

      - name: Refresh FSSAI food testing lab directories (PDF table extraction)
        id: fssai_labs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # lab directory, not core enforcement data — don't fail the run
        run: |
          pip install --quiet playwright pdfplumber
          python -m playwright install --with-deps chromium
          python -m pipeline.run_and_log fssai_labs

      - name: Refresh Lok Sabha FSSAI enforcement Q&A data (real state-wise data)
        id: loksabha_qa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # new Parliament questions appear a few times a year, not daily
        run: |
          pip install --quiet pdfplumber
          python -m pipeline.run_and_log loksabha_qa

      - name: Refresh FSSAI Annual Report national enforcement metrics
        id: fssai_annual_report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # annual reports change once a year — never a real regression signal
        run: |
          pip install --quiet pdfplumber
          python -m pipeline.run_and_log fssai_annual_report

      - name: Refresh Mumbai local-news food-safety signal (locality-tagged)
        id: local_news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # best-effort scrape of two news sites; 0 rows is expected, not a regression
        # docs/LOCAL_NEWS_INGESTION.md: now covers 5 metros (Mumbai, Delhi,
        # Bengaluru, Chennai, Pune), verified live 2026-09-18 to find real
        # signal on the first multi-city pull. Running daily lets real
        # signal accumulate over time instead of being a one-off manual
        # pull. Idempotent (dedups on sha256(source_url|contaminant_id))
        # so re-running daily is safe. limit=20 is a *global* cap on
        # records_produced across all 6 sources (fetch_records() stops
        # once it's hit, not per-source), so raised from the original
        # single-city value to give every city a fair shot at the cap.
        run: |
          pip install --quiet beautifulsoup4 lxml
          python -m pipeline.run_and_log local_news --limit 50

      - name: Ingest scientific evidence links (OpenAlex, real DOIs/abstracts)
        id: research_evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # supplementary literature layer, not core enforcement data
        # limit=150/contaminant (9 contaminants today) = up to ~1,350
        # OpenAlex works/day (per-page 200 is OpenAlex's own documented
        # max; verified live at 200 returns ~150-165 usable doi+abstract
        # rows per term). Still well inside the free "polite pool" rate
        # limit, and _fetch() now retries once on a transient 429 instead
        # of dropping a whole contaminant's results. First run does the
        # bulk load; later daily runs mostly re-hit the same works and
        # dedupe on doi, so this doesn't grow unbounded — it converges
        # once each contaminant's real literature is covered.
        run: python -m pipeline.run_and_log research_evidence --limit 150

      - name: Enrich scientific evidence with Europe PMC study-design data
        id: europepmc_evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # supplementary literature layer, not core enforcement data
        # Runs after research_evidence so it can enrich those rows by
        # DOI/PMID (real pubType-based study_design) instead of just adding
        # duplicates — see pipeline/sources/europepmc_evidence.py. Same
        # limit=150/contaminant reasoning as the OpenAlex step above
        # (Europe PMC's own pageSize max is 1,000, so 150 has headroom).
        run: python -m pipeline.run_and_log europepmc_evidence --limit 150

      - name: Alert on unexpected AGMARKNET failure
        if: steps.agmarknet.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Ingest regression: AGMARKNET failed ($(date -u +%F))" \
            --body "AGMARKNET raised an exception (not just an empty/rate-limited result) in the scheduled ingest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ingest-failure" || true

      - name: Alert on unexpected FoSCoS scrape failure
        if: steps.fssai_recall.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Ingest regression: FoSCoS scraper failed ($(date -u +%F))" \
            --body "The FoSCoS scraper raised an exception (not the documented 401/maintenance gate) in the scheduled ingest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This may mean FoSCoS access changed — see docs/FSSAI_INGESTION.md." \
            --label "ingest-failure" || true

      - name: Recompute aggregation (district + brand risk scores)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m models.aggregate

      - name: Recompute disease burden estimates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true   # don't let a modelling error block ingestion
        run: python -m models.disease_burden compute_all

      - name: Send pending alert-subscription notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        continue-on-error: true   # RESEND_API_KEY may be unset — that's a no-op, not a failure
        run: python -m models.notifications
