name: Refresh food standards and hazard knowledge base

# Weekly: re-reads the four rule-books FoodSafe compares (India FSSAI, EU, Codex,
# US), refreshes the hazard -> health knowledge base, country context and the
# packaged-food table, and recomputes the India vs EU/Codex/US comparison. Rule-
# books change a few times a year, so weekly is plenty; each load records the
# exact document version it parsed (standards_snapshots). See docs/STANDARDS.md
# and docs/HAZARD_KB.md.
#
# Separate from ingest.yml on purpose: these are slow-changing reference
# documents, and a failure here must not delay the daily contamination ingest.
#
# Jobs: schema -> (eu_pesticides || rulebooks) -> knowledge. The EU Pesticides
# Database read (~1,400 API pages) is by far the slowest source, so it runs in its
# own job and can no longer starve the others of the time budget. The knowledge
# job runs whatever happened upstream (each loader keeps its last good slice on
# failure), because the comparison must be recomputed from what is loaded.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

# Two runs replacing the same slices at once could interleave; queue instead.
concurrency:
  group: standards
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet psycopg2-binary
      - name: Sync database schema (idempotent)
        id: bootstrap_db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.bootstrap_db
      - name: Alert on failed steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/ingest_alert.py

  eu_pesticides:
    needs: schema
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet psycopg2-binary
      - name: EU — Pesticides Database (MRLs, approval status, ADI/ARfD)
        id: standards_eu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_eu
      - name: Alert on failed steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/ingest_alert.py

  rulebooks:
    needs: schema
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet psycopg2-binary pdfplumber

      # Each loader replaces only its own (jurisdiction, type) slice inside one
      # transaction and refuses to replace a populated slice with an empty parse,
      # so one source failing leaves the others' last good load in place.

      - name: India — FSSAI Contaminants, Toxins and Residues Regulations (PDF)
        id: standards_fssai
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_fssai

      - name: EU — Regulation 2023/915 contaminant maximum levels (EUR-Lex)
        id: standards_eu_contaminants
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_eu_contaminants

      - name: Codex — pesticide MRLs and JMPR ADIs
        id: standards_codex
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_codex

      - name: Codex — CXS 193 contaminant maximum levels (PDF)
        id: standards_codex_contaminants
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_codex_contaminants

      - name: US — 40 CFR 180 pesticide tolerances (eCFR)
        id: standards_us
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log standards_us

      - name: Country context — WHO GHO food-safety capacity + global foodborne burden, World Bank nutrition
        id: country_indicators
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log country_indicators

      - name: Packaged foods sold in India (Open Food Facts bulk export, ~1.3 GB streamed)
        id: off_india
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log off_india

      - name: Alert on failed steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/ingest_alert.py

  knowledge:
    needs: [schema, eu_pesticides, rulebooks]
    # Run even if a loader job failed or timed out; never if the schema is missing.
    if: ${{ always() && needs.schema.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet psycopg2-binary

      # After the EU job: the KB joins IARC groups to pesticides by the CAS
      # numbers the EU substances load stores.
      - name: Hazard -> health knowledge base (IARC + curated sources)
        id: hazard_kb
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run_and_log hazard_kb

      - name: Recompute India vs EU / Codex / US comparison
        id: standards_compare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m models.standards_compare

      - name: Alert on failed steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/ingest_alert.py
